spring:
  application:
    name: campus-mental-health
  datasource:
    url: ${DB_URL:jdbc:h2:file:./runtime/campus-mental-health}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  demo:
    enabled: ${DEMO_ENABLED:true}
    password: ${DEMO_PASSWORD:Campus2026!}
    dataset: ${DEMO_DATASET:../data/downloads/student-mental-health.csv}

  ml:
    dataset: ${ML_DATASET:../data/downloads/student_lifestyle_100k.csv}
    auto-train: ${ML_AUTO_TRAIN:true}
    artifacts: ${ML_ARTIFACTS:../models/artifacts}
